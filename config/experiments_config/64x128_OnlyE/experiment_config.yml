# Ablation with a single-phase dataset schedule and no expert replay seeding.
experiment_name: "Experiment_64x128_OnlyE"
seed: 42
device: "cuda"

code_id: "64x128"

# Pipeline
run_dataset_creation: true
run_training: true
run_evaluation: true

# Dataset and expert replay
dataset_creation:
  config_path: "config/experiments_config/64x128_OnlyE/main_dataset_config.json" # Curriculum configuration
  output_path: "data/ldpc_64x128_main_dataset.h5"
  test_size: 0.3
  force_recreate: true # If true, recreates dataset even if it exists

expert_experience:
  use_pregenerated_file: false # If true, load from pregenerated_file
  pregenerated_file: "data/64x128_omniscient_500000.pkl" # Path to pregenerated experiences

# Training
training:
  num_epochs: 1
  replay_buffer_size: 2500000
  batch_size: 32
  target_update_freq: 1000
  learning_rate: 0.0001
  weight_decay: 0.0001

  epsilon_decay_type: "linear"  # Options: "exponential" or "linear"
  epsilon_decay:  [0.0000100001, 0.0000080001, 0.0000040001] 
  epsilon_start: [1.0, 0.6, 0.3]  # Starting epsilon per phase (exploration rate)
  epsilon_min: [0.6, 0.3, 0.05]  # Minimum epsilon per phase (minimum exploration)
  epsilon_phase_reset: true
  
  network:
    type: "LDPCOptimizedMLP"
    dropout_rate: 0.05
    leaky_slope: 0.01
    hidden_dim1: 640

# Evaluation
evaluation:
  baseline_agents:
    - name: "random"
      enabled: false
    - name: "greedy"
      enabled: false
    - name: "simple_classical"
      enabled: false
    - name: "min_sum" # Disabled for runtime cost.
      enabled: false
    - name: "min_sum_expert"
      enabled: false 

# Environment
environment:
  max_steps: 12 # Allows bounded exploration beyond the expected correction path.
  max_flips_vector: 7 # Allows margin above the theoretical t=6 correction radius.

# Model loading
load_pretrained_model:
  enabled: false               # Set to true to load a pre-trained model
  model_path: "models/ldpc_rl_agent.pth"  # Path to pre-trained model
  overwrite: false             # If true, overwrite the loaded model after training/distillation
                               # If false, create new checkpoint (preserves original model)

# Output paths
output_paths:
  results_dir: "results/"      # Directory for metrics, logs, and training data
  models_dir: "models/"        # Directory for model checkpoints and saved models

# Memory management
memory_management:
  training:
    max_episodes_per_phase: 100000  # Episodes to keep in memory per curriculum phase
    auto_flush_frequency: 50001    # Check memory every N episodes
    enable_progressive_saving: true # Enable phase-based saving
  
  evaluation:
    max_episodes_per_agent: 100000  # Episodes to keep in memory per agent evaluation
    auto_flush_frequency: 50001     # Check memory every N episodes (less frequent)
    enable_progressive_saving: true # Enable agent-based saving
